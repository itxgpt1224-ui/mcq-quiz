name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Zip kholo aur project dhundo
        run: |
          mkdir -p app_src
          for z in *.zip; do unzip -q -o "$z" -d app_src; done
          P=$(dirname "$(find app_src -name pubspec.yaml | head -1)")
          echo "Project folder: $P"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"

      - name: Android project banao aur permission lagao
        run: |
          flutter create --platforms=android --project-name mcq_quiz "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" "$PROJECT_DIR/android"
          F="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.INTERNET' "$F" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$F"

      - name: Plugins ke liye Android SDK 36 lagao
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/fix-sdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  try {
                      if (p.hasProperty('android')) {
                          p.android.compileSdkVersion 36
                      }
                  } catch (Throwable t) {
                      println "compileSdk fix skipped for ${p.name}: ${t.message}"
                  }
              }
          }
          EOF

      - name: APK banao (release arm64 aur debug)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi --target-platform android-arm64
          flutter build apk --debug --target-platform android-arm64

      - name: APK ki signing check
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          ls -l build/app/outputs/flutter-apk/
          "$BT/apksigner" verify --verbose build/app/outputs/flutter-apk/app-arm64-v8a-release.apk || true
          "$BT/aapt2" dump badging build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | head -15 || true

      - uses: actions/upload-artifact@v4
        with:
          name: mcq-quiz-apk
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk

      - name: Release page par APK lagao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
